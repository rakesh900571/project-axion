name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

# =========================================================
# TERRAFORM PLAN
# =========================================================

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, windows, x64]

    environment: preprod

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Terraform Format
      - name: Terraform Format
        shell: powershell
        run: terraform fmt -check -recursive

      # Terraform Init
      - name: Terraform Init
        shell: powershell
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        shell: powershell
        run: terraform validate

      # Show Azure Subscription
      - name: Verify Azure Subscription
        shell: powershell
        run: |
          az account show --query "{Name:name, Subscription:id, Tenant:tenantId}" -o table

      # Show Terraform State
      - name: Terraform State
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM STATE ====="
          terraform state list

      # Terraform Plan
      - name: Terraform Plan
        shell: powershell
        run: |
          Write-Host "===== TERRAFORM PLAN ====="
          terraform plan


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================

  terraform-apply:
    name: Terraform Apply
    runs-on: [self-hosted, windows, x64]

    needs: terraform-plan

    # Apply only on main branch push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: preprod

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Terraform Init
      - name: Terraform Init
        shell: powershell
        run: terraform init

      # Verify Azure Subscription
      - name: Verify Azure Subscription
        shell: powershell
        run: |
          az account show --query "{Name:name, Subscription:id, Tenant:tenantId}" -o table

      # Show Current State
      - name: Terraform State
        shell: powershell
        run: |
          Write-Host "===== CURRENT TERRAFORM STATE ====="
          terraform state list

      # Terraform Apply
      - name: Terraform Apply
        shell: powershell
        run: |
          terraform apply -auto-approve