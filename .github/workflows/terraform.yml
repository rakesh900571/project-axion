name: "Azure Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub-Hosted Runner OS'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-latest
      environment:
        description: 'Target Environment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - preprod
          - prod
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan_and_apply'
        type: choice
        options:
          - plan_and_apply
          - plan_only
          - apply_only

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TERRAFORM_VERSION: "1.9.0"
  DEFAULT_RUNNER: "ubuntu-latest" # GitHub-Hosted Runner
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ==========================================
  # Job 1: Linting and Code Quality Check
  # ==========================================
  terraform-fmt-lint:
    name: "1. Code Quality & Format Check"
    # GitHub-Hosted Runner configuration
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

  # ==========================================
  # Job 2: Terraform Init & Plan (Matrix)
  # ==========================================
  terraform-plan:
    name: "2. Plan (${{ matrix.environment }})"
    needs: [terraform-fmt-lint]
    # GitHub-Hosted Runner configuration
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [preprod, prod]
    
    # Skip if manual dispatch selected specific environment and this matrix item is not selected
    if: |
      github.event_name != 'workflow_dispatch' || 
      github.event.inputs.environment == 'all' || 
      github.event.inputs.environment == matrix.environment

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Optional fallback if AZURE_CREDENTIALS secret is used)
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan_${{ matrix.environment }}.tfplan
        continue-on-error: false

      - name: Create Human Readable Plan Summary
        run: |
          echo "### Environment: `${{ matrix.environment }}`" >> $GITHUB_STEP_SUMMARY
          echo "#### Terraform Plan Output" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan_${{ matrix.environment }}.tfplan | head -n 250 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan_${{ matrix.environment }}.tfplan
          retention-days: 7

      - name: Post Plan to Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = `### Terraform Plan Summary (\`${{ matrix.environment }}\`)
            #### Initialization: \`${{ steps.init.outcome }}\`
            #### Validation: \`${{ steps.validate.outcome }}\`
            #### Plan Status: \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Details</summary>

            \`\`\`hcl
            ${process.env.PLAN_OUTPUT || 'Plan generated successfully.'}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ==========================================
  # Job 3: Terraform Apply (Matrix)
  # ==========================================
  terraform-apply:
    name: "3. Apply (${{ matrix.environment }})"
    needs: [terraform-plan]
    # GitHub-Hosted Runner configuration
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [preprod, prod]

    # Only run apply on push to main or manual dispatch (when plan_and_apply or apply_only selected)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && 
        (github.event.inputs.action == 'plan_and_apply' || github.event.inputs.action == 'apply_only') &&
        (github.event.inputs.environment == 'all' || github.event.inputs.environment == matrix.environment))

    environment: ${{ matrix.environment }}

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Optional fallback if AZURE_CREDENTIALS secret is used)
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan_${{ matrix.environment }}.tfplan
