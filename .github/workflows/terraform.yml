name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        working-directory: environments/preprod

    steps:

      # Checkout Repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # Verify Azure Login
      - name: Check Azure Account
        shell: powershell
        run: |
          az account show

      # Set Azure Subscription
      - name: Set Azure Subscription
        shell: powershell
        run: |
          az account set `
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      # Verify Azure Subscription
      - name: Verify Azure Subscription
        shell: powershell
        run: |
          az account show

      # Terraform Format Check
      - name: Terraform Format
        shell: powershell
        run: |
          terraform fmt -check -recursive

      # Terraform Initialize
      - name: Terraform Init
        shell: powershell
        run: |
          terraform init

      # Terraform Validate
      - name: Terraform Validate
        shell: powershell
        run: |
          terraform validate

      # Terraform Plan
      - name: Terraform Plan
        shell: powershell
        run: |
          terraform plan