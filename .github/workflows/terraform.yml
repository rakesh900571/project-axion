name: Terraform Azure Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "environment/preprod/**"
      - ".github/workflows/terraform-azure.yml"
  pull_request:
    branches: [main]
    paths:
      - "environment/preprod/**"
  workflow_dispatch: {}

# Required so the OIDC token can be requested and the checkout works
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.6.6"
  WORKING_DIR: "environment/preprod"

  # Azure OIDC login values — set these as GitHub Actions secrets
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

  # Remote state backend (Azure Storage) — set these as secrets/vars too
  TF_BACKEND_RG: RG-RAKESH
  TF_BACKEND_SA: dev9005711880
  TF_BACKEND_CONTAINER: tfstate

  # Terraform input variable, since storage account names must be globally unique
  # TF_VAR_storage_account_name: ${{ secrets.TF_STORAGE_ACCOUNT_NAME }}

jobs:
  terraform:
    name: Terraform
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name= RG-RAKESH" \
            -backend-config="storage_account_name=dev9005711880" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=infra.terraform.tfstate"

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan Result to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Format: \`${{ steps.fmt.outcome }}\`
            #### Terraform Init: \`${{ steps.init.outcome }}\`
            #### Terraform Validate: \`${{ steps.validate.outcome }}\`
            #### Terraform Plan: \`${{ steps.plan.outcome }}\`

            *Pushed by @${{ github.actor }}, action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Only apply automatically on pushes to main (i.e. after PR merge)
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan